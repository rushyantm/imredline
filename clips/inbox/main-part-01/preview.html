.c3 { /* was: text-xl text-slateGray font-crimson text-center */

  text-align: center;
}

}
.c6 { /* was: pb-4 pl-2 border-b transition-colors */

.c7 { /* was: lg:w-[70%] w-[90%] */

}
.c8 { /* was: pb-4 pl-2 border-b transition-colors */

  width: 100%;
  border-top-width: 0px;

.c9 { /* was: relative w-full h-[540px] overflow-hidden */

  width: 100%;
  height: 540px;
  overflow-x: hidden;
  overflow-y: hidden;
}
.c10 { /* was: object-cover absolute top-0 left-0 */

  position: absolute;
  top: 0px;
  right: 0px;
  bottom: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  max-width: 100%;
  color: #00000000;
  vertical-align: middle;
  transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  object-fit: cover;
}
.c11 { /* was: object-cover absolute top-0 left-0 */
  display: block;
  position: absolute;
  top: 0px;
  right: 0px;
  bottom: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  max-width: 100%;
  opacity: 0;
  color: #00000000;
  vertical-align: middle;
  transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  object-fit: cover;
}
.c12 { /* was: w-[90%] */
  width: 90%;
